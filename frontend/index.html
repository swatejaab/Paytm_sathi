<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Paytm Saathi: your AI companion for everyday financial decisions and emergencies." />
    <meta name="theme-color" content="#00baf2" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300baf2'/%3E%3Cstop offset='1' stop-color='%230f4a8a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='12' fill='url(%23g)'/%3E%3Cpath d='M12 25c2 3 5 4 8 4 4 0 7-2 7-5.5S24 18.5 20 17.5s-6.5-1.6-6.5-4.5S16.5 9 20 9c2.6 0 4.7 1 6 3' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Paytm Saathi</title>
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('saathi.theme');
        } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
