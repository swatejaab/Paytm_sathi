# Hospital bill with an insurance funding gap (hero journey).
id: hospital_bill
version: 1
title: Hospital bill with an insurance funding gap
event_type: hospitalization
urgency: high
priority: 10
triggers:
  any: [hospital, hospitalized, hospitalised, admitted, surgery, icu, discharge, अस्पताल, हॉस्पिटल, भर्ती, ऑपरेशन]
  weak: [papa, father, mother, mummy, पापा, पिताजी, माँ, मम्मी]
engine: builtin:hospital_gap
auditor: bill_auditor
tools:
  read: [payments.get_balance, insurer.get_policy, insurer.check_coverage, insurer.get_claim_checklist, hospital.get_bill, hospital.get_documents, knowledge.search_policy, lending.get_offers, lending.check_affordability, lending.get_kfs, aa.request_consent, aa.fetch_fi_data]
  write: [claim.submit, hospital.request_document, lending.submit_application, payments.create_link, hospital.request_cashless, crm.handoff_to_agent]
exit: all approved partner steps completed
guidance:
  title: Hospital bill with an insurance funding gap
  source: Saathi demo playbook v1
  steps:
    - Collect the itemized final bill and the health policy schedule.
    - Check eligible inpatient expenses, room category limits, and claim document requirements.
    - Calculate verified coverage and what the family can pay now before considering credit.
    - Borrow only the remaining gap, and only if the EMI passes the affordability guardrail.
    - Submit the claim with the full document set and track partner status until closure.
