# Unrecognized UPI debit (fraud or scam).
id: upi_fraud
version: 1
title: Unrecognized UPI debit
event_type: upi_dispute
urgency: high
priority: 20
triggers:
  any: [upi, unrecognized, unrecognised, not mine, fraud, scam, nahi kiya, "didn't make", did not make, unknown transaction, यूपीआई, धोखा, फ्रॉड, नहीं किया]
engine: builtin:upi_dispute
auditor: transaction_auditor
pick_transaction:
  prompt: Which payment do you not recognize?
  mode: dispute
  filter: { direction: debit }
  match_stated_amount: true
tools:
  read: [payments.get_balance, payments.list_transactions, payments.get_transaction, knowledge.search_playbook]
  write: [payments.open_dispute, crm.handoff_to_agent]
exit: dispute closed by the payment network
guidance:
  title: Unrecognized UPI debit
  source: Saathi demo playbook v1
  steps:
    - Confirm the debit is unfamiliar and note the transaction reference, time, and counterparty.
    - Block or pause UPI in the payment app and change the UPI PIN.
    - Report the incident to the bank or payment app as soon as possible; prompt reporting can limit customer liability under bank rules.
    - Report cyber fraud on the national helpline 1930 or at cybercrime.gov.in.
    - Track the dispute reference until the payment network closes it.
